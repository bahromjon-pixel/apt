<script src="js/site-config.js"></script>
<script>
  (function () {
    function loadNews() {
      let url = `https://raw.githubusercontent.com/${SITE_CONFIG.GH_OWNER}/${SITE_CONFIG.GH_REPO}/${SITE_CONFIG.GH_BRANCH}/${SITE_CONFIG.NEWS_PATH}`;

      fetch(url)
        .then(res => res.json())
        .then(list => {
          let container = document.getElementById("news-list");
          let noData = document.getElementById("news-no-data");
          if (!container) return;

          if (!list || list.length === 0) {
            if (noData) noData.style.display = "block";
            container.innerHTML = "";
            return;
          }
          if (noData) noData.style.display = "none";

          let html = "";
          list.reverse().forEach((item, i) => {
            let delay = 0.1 + (i % 3) * 0.2;
            html += `<div class="col-lg-4 col-md-6 wow fadeInUp" data-wow-delay="${delay}s">
                      <div class="course-item bg-light h-100">
                        <div class="position-relative overflow-hidden">
                          <img class="img-fluid" src="${item.image}" alt="" style="width:100%;height:200px;object-fit:cover" />
                        </div>
                        <div class="text-center p-4 pb-2">
                          <h5 class="mb-3">${item.title}</h5>
                          <p class="mb-2">${item.text}</p>
                        </div>
                        <div class="border-top d-flex justify-content-center py-3">
                          <small class="text-primary"><i class="fa fa-clock me-1"></i>${item.date}</small>
                        </div>
                      </div>
                    </div>`;
          });
          container.innerHTML = html;
        })
        .catch(err => console.error("Yangiliklarni yuklashda xatolik:", err));
    }
    loadNews();
  })();
</script>
