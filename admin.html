<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <title>Admin Panel - Yangiliklarni Boshqarish</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 800px;">
        <h2 class="mb-4 text-center text-primary">Texnikum Admin Paneli</h2>
        
        <!-- Login qismi -->
        <div id="login-box" class="card p-4 mx-auto shadow-sm" style="max-width: 450px;">
            <h4 class="mb-3 text-center">Tizimga kirish</h4>
            <div class="mb-3">
                <label class="form-label">GitHub Access Token:</label>
                <input type="password" id="admin-pass" class="form-control" placeholder="ghp_... tokenni kiriting">
                <small class="text-muted d-block mt-1">Yangiliklarni boshqarish uchun GitHub tokenni kiriting.</small>
            </div>
            <button class="btn btn-primary w-100" onclick="checkLogin()">Kirish</button>
        </div>

        <!-- Admin boshqaruv qismi -->
        <div id="admin-panel" style="display: none;">
            <div class="card p-4 shadow-sm mb-4">
                <h4 id="form-title" class="mb-3">Yangi yangilik qo'shish</h4>
                <input type="hidden" id="edit-id" value="">
                
                <div class="mb-3">
                    <label class="form-label">Yangilik sarlavhasi:</label>
                    <input type="text" id="news-title" class="form-control" placeholder="Sarlavhani kiriting...">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Rasmni kompyuterdan tanlash (Qulay yuklash):</label>
                    <input type="file" id="news-img-file" class="form-control" accept="image/*" onchange="previewAndUploadImage(this)">
                    <div class="form-text">Rasm tanlasangiz, u avtomatik ravishda `img/` papkaga yuklanadi.</div>
                    <!-- Tanlangan rasmni ko'rsatib turish uchun -->
                    <input type="hidden" id="news-img" value="img/course-1.jpg">
                    <div id="img-preview-container" class="mt-2" style="display: none;">
                        <img id="img-preview" src="" alt="Rasm" style="height: 100px; border-radius: 5px; border: 1px solid #ddd;">
                        <span id="upload-status" class="ms-2 text-success fw-bold"></span>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Yangilik matni:</label>
                    <textarea id="news-text" class="form-control" rows="4" placeholder="Yangilik matnini kiriting..."></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-success" id="save-btn" onclick="saveNewsToGitHub()">Saqlash va Hammaga chiqarish</button>
                    <button class="btn btn-secondary" id="cancel-btn" onclick="resetForm()" style="display:none;">Bekor qilish</button>
                </div>
            </div>
            
            <div class="card p-4 shadow-sm">
                <h4>Mavjud yangiliklar ro'yxati</h4>
                <div id="admin-news-list" class="mt-3">Yuklanmoqda...</div>
            </div>
        </div>
    </div>

    <script src="./js/site-config.js"></script>
    <script>
        let githubToken = "";
        let newsList = [];
        let shaKey = ""; 
        let uploadedImagePath = "img/course-1.jpg";

        function checkLogin() {
            githubToken = document.getElementById("admin-pass").value.trim();
            if (!githubToken) {
                alert("Iltimos, GitHub tokenini kiriting!");
                return;
            }

            if (typeof SITE_CONFIG === "undefined" || !SITE_CONFIG.GH_OWNER || !SITE_CONFIG.GH_REPO) {
                alert("js/site-config.js faylida sozlamalar noto'g'ri!");
                return;
            }

            fetchNewsFromGitHub();
        }

        function getApiUrl() {
            return `https://api.github.com/repos/${SITE_CONFIG.GH_OWNER}/${SITE_CONFIG.GH_REPO}/contents/${SITE_CONFIG.NEWS_PATH}`;
        }

        function fetchNewsFromGitHub() {
            fetch(getApiUrl(), {
                headers: { 
                    "Authorization": `Bearer ${githubToken}`,
                    "Accept": "application/vnd.github.v3+json"
                }
            })
            .then(res => {
                if (res.status === 401) throw new Error("Token noto'g'ri yoki muddati tugagan!");
                if (res.status === 404) throw new Error("data/news.json fayli topilmadi!");
                if (!res.ok) throw new Error("GitHub bilan bog'lanishda xatolik.");
                return res.json();
            })
            .then(data => {
                shaKey = data.sha;
                let binaryStr = atob(data.content.replace(/\s/g, ''));
                let bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }
                newsList = JSON.parse(new TextDecoder('utf-8').decode(bytes));
                if (!Array.isArray(newsList)) newsList = [];

                document.getElementById("login-box").style.display = "none";
                document.getElementById("admin-panel").style.display = "block";
                renderAdminList();
            })
            .catch(err => {
                alert(err.message);
                console.error(err);
            });
        }

        // Rasmni tanlaganda uni avtomatik ravishda GitHub'dagi img/ papkasiga yuklash
        function previewAndUploadImage(input) {
            if (input.files && input.files[0]) {
                let file = input.files[0];
                let reader = new FileReader();
                
                document.getElementById("upload-status").innerText = "Yuklanmoqda...";
                document.getElementById("img-preview-container").style.display = "block";

                reader.onload = function (e) {
                    let preview = document.getElementById("img-preview");
                    preview.src = e.target.result;

                    // Base64 kodini ajratib olamiz
                    let base64Content = e.target.result.split(',')[1];
                    let fileName = "news_" + Date.now() + "_" + file.name.replace(/\s+/g, '_');
                    let targetPath = `img/${fileName}`;

                    // GitHub API orqali img/ papkasiga rasm faylini joylash
                    let imgApiUrl = `https://api.github.com/repos/${SITE_CONFIG.GH_OWNER}/${SITE_CONFIG.GH_REPO}/contents/${targetPath}`;
                    
                    fetch(imgApiUrl, {
                        method: "PUT",
                        headers: {
                            "Authorization": `Bearer ${githubToken}`,
                            "Content-Type": "application/json",
                            "Accept": "application/vnd.github.v3+json"
                        },
                        body: JSON.stringify({
                            message: "Admin paneldan yangi rasm yuklandi",
                            content: base64Content,
                            branch: SITE_CONFIG.GH_BRANCH || "main"
                        })
                    })
                    .then(res => {
                        if (res.ok) {
                            uploadedImagePath = targetPath;
                            document.getElementById("news-img").value = targetPath;
                            document.getElementById("upload-status").innerText = "Rasm muvaffaqiyatli yuklandi! ✔";
                        } else {
                            document.getElementById("upload-status").innerText = "Rasmni yuklashda xatolik!";
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        document.getElementById("upload-status").innerText = "Xatolik yuz berdi.";
                    });
                };
                reader.readAsDataURL(file);
            }
        }

        function renderAdminList() {
            let html = "";
            if (newsList.length === 0) {
                document.getElementById("admin-news-list").innerHTML = "<p class='text-muted'>Hozircha yangiliklar yo'q.</p>";
                return;
            }

            newsList.forEach((item, index) => {
                let thumb = item.image ? `<img src="${item.image}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 4px; margin-right: 10px;">` : '';
                html += `<div class="border p-3 mb-2 d-flex justify-content-between align-items-center bg-white shadow-sm rounded">
                        <div class="d-flex align-items-center">${thumb}<div><strong>${item.title}</strong><br><small class="text-muted">${item.date || ''}</small></div></div>
                        <div>
                        <button class="btn btn-primary btn-sm me-2" onclick="editNews(${index})">Tahrirlash</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteNews(${index})">O'chirish</button>
                        </div></div>`;
            });
            document.getElementById("admin-news-list").innerHTML = html;
        }

        function saveNewsToGitHub() {
            let title = document.getElementById("news-title").value.trim();
            let text = document.getElementById("news-text").value.trim();
            let img = document.getElementById("news-img").value.trim();
            let editId = document.getElementById("edit-id").value;

            if (!title || !text) {
                alert("Sarlavha va matnni to'ldirish majburiy!");
                return;
            }

            let dateNow = new Date();
            let formattedDate = dateNow.toLocaleDateString('uz-UZ') + " " + dateNow.toLocaleTimeString('uz-UZ', {hour: '2-digit', minute:'2-digit'});

            if (editId === "") {
                newsList.push({
                    id: Date.now(),
                    title: title,
                    image: img || uploadedImagePath || "img/course-1.jpg",
                    text: text,
                    date: formattedDate
                });
            } else {
                newsList[editId].title = title;
                newsList[editId].text = text;
                newsList[editId].image = img;
            }

            updateGitHubFile();
        }

        function updateGitHubFile() {
            let jsonString = JSON.stringify(newsList, null, 2);
            let bytes = new TextEncoder().encode(jsonString);
            let binaryStr = "";
            for (let i = 0; i < bytes.byteLength; i++) {
                binaryStr += String.fromCharCode(bytes[i]);
            }
            let updatedContent = btoa(binaryStr);

            fetch(getApiUrl(), {
                method: "PUT",
                headers: {
                    "Authorization": `Bearer ${githubToken}`,
                    "Content-Type": "application/json",
                    "Accept": "application/vnd.github.v3+json"
                },
                body: JSON.stringify({
                    message: "Admin paneldan yangiliklar yangilandi",
                    content: updatedContent,
                    sha: shaKey,
                    branch: SITE_CONFIG.GH_BRANCH || "main"
                })
            })
            .then(res => {
                if (res.ok) {
                    alert("Yangilik muvaffaqiyatli saqlandi va hammaga e'lon qilindi!");
                    resetForm();
                    fetchNewsFromGitHub();
                } else {
                    alert("Saqlashda xatolik yuz berdi.");
                }
            })
            .catch(err => console.error(err));
        }

        function editNews(index) {
            let item = newsList[index];
            document.getElementById("news-title").value = item.title;
            document.getElementById("news-text").value = item.text;
            document.getElementById("news-img").value = item.image;
            document.getElementById("edit-id").value = index;
            
            // Tahrirlashda eski rasmni ko'rsatish
            let preview = document.getElementById("img-preview");
            preview.src = item.image;
            document.getElementById("img-preview-container").style.display = "block";
            document.getElementById("upload-status").innerText = "Joriy rasm";

            document.getElementById("form-title").innerText = "Yangilikni tahrirlash";
            document.getElementById("save-btn").innerText = "O'zgarishlarni saqlash";
            document.getElementById("cancel-btn").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById("news-title").value = "";
            document.getElementById("news-text").value = "";
            document.getElementById("news-img-file").value = "";
            document.getElementById("news-img").value = "img/course-1.jpg";
            document.getElementById("edit-id").value = "";
            document.getElementById("img-preview-container").style.display = "none";
            document.getElementById("form-title").innerText = "Yangi yangilik qo'shish";
            document.getElementById("save-btn").innerText = "Saqlash va Hammaga chiqarish";
            document.getElementById("cancel-btn").style.display = "none";
        }

        function deleteNews(index) {
            if (confirm("Haqiqatan ham bu yangilikni o'chirmoqchimisiz?")) {
                newsList.splice(index, 1);
                updateGitHubFile();
            }
        }
    </script>
</body>
</html>
